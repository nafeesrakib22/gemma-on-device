services:
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gemma-inference
    volumes:
      - ./models:/models
    environment:
      - LLAMA_ARG_MODEL=/models/google_gemma-4-E2B-it-Q4_K_M.gguf
      - LLAMA_ARG_CTX_SIZE=4096
      - LLAMA_ARG_N_PARALLEL=5
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_HOST=0.0.0.0
    restart: unless-stopped

  app:
    build: .
    image: gemma-app:latest
    container_name: gemma-app
    ports:
      - "7860:7860"
    environment:
      - INFERENCE_URL=http://inference:8080/v1/chat/completions
      - PROMPT_TYPE=survey
    depends_on:
      - inference
    restart: unless-stopped
