services:
  inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gemma-inference
    volumes:
      - ./models:/models
      - ./system_prompt.txt:/system_prompt.txt
    command: >
      -m /models/google_gemma-4-E2B-it-Q4_K_M.gguf
      -c 16384
      -np 5
      -t 8
      -cb
      -sp /system_prompt.txt
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped

  app:
    build: .
    image: gemma-app:latest
    container_name: gemma-app
    ports:
      - "7860:7860"
    environment:
      - INFERENCE_URL=http://inference:8080/v1/chat/completions
      - PROMPT_TYPE=survey
    depends_on:
      - inference
    restart: unless-stopped
