services:
  gemma:
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 6G
    build: .
    image: gemma-chat:latest
    container_name: gemma-chat
    ports:
      - "7860:7860"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
