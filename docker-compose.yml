services:
  gemma:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    build: .
    image: gemma-chat:latest
    container_name: gemma-chat
    ports:
      - "7860:7860"
    volumes:
      # Mount the model directory from the host. 
      # Adjust the local path (left side) if your models are stored elsewhere.
      - /home/moriarty4k/.litert-lm/models:/models
    environment:
      - MODEL_PATH=/models/gemma-e2b/model.litertlm
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
